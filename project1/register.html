<div class="box-form">
<h2 class="mb-3 text-center">Registrasi</h2>
<div id="pesan"></div>
<form id="formDaftar" novalidate>
<div class="mb-3"><label class="form-label" for="nama">Nama lengkap</label><input class="form-control" id="nama"></div>
<div class="mb-3"><label class="form-label" for="email">Email</label><input class="form-control" id="email" placeholder="nama@email.com"></div>
<div class="mb-3"><label class="form-label" for="username">Username</label><input class="form-control" id="username"></div>
<div class="mb-3"><label class="form-label" for="password">Password</label><input type="password" class="form-control" id="password"></div>
<div class="mb-3"><label class="form-label" for="konfirmasi">Konfirmasi password</label><input type="password" class="form-control" id="konfirmasi"></div>
<button class="btn btn-karamel w-100" type="submit">Daftar</button>
</form>
<p class="text-center small mt-3 mb-0">Sudah punya akun? <a href="login.html">Login</a></p>
